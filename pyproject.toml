[project]
name = "bizplan-updater"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "rich>=13.0",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.scripts]
bizplan = "bizplan.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bizplan"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
